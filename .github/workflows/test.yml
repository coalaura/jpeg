name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Fixture tests with the native C/C++ toolchain
        run: go test ./...
      - name: Format detection without CGO
        env:
          CGO_ENABLED: "0"
        run: go test ./detect

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: coalaura/build@v1
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          cgo: true
          optimization: compatible
          generate: false
          package: ./internal/probe
          output: .build/probe-${{ matrix.os }}-${{ matrix.arch }}
